<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-sphere position="0 1 -4" phi-length="-300" rotation="90 0 0" side="double" color="yellow"></a-sphere>
      <a-sphere position="-0.5 1.5 -3.5" color="black" scale="0.25 0.25 0.25"></a-sphere>
      <a-sphere position="-0.5 1.5 -4.5" color="black" scale="0.25 0.25 0.25"></a-sphere>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>

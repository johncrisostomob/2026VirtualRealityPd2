<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box wireframe=true position="0 1.5 -3" width="8" height="4" depth="4">
        <a-box rotation="0 0 0" width="4" height="1" depth="2" color="black"></a-box>
        <a-plane position="0 0.63 0.75" rotation="-60 0 0" width="4" height="0.5" color="blue" side="double"></a-plane>
        <a-plane position="0 0.63 -0.75" rotation="60 0 0" width="4" height="0.5" color="blue" side="double"></a-plane>
        <a-triangle position="0 0.12 1.01" scale="3 .5" rotation="0 0 0" color="silver" side="double"></a-triangle>
        <a-triangle position="0 0.12 -1.01" scale="3 .5" rotation="0 0 0" color="silver" side="double"></a-triangle> 
        <a-cylinder position="-1 -1 0.75" rotation="90 0 0" scale="1 0.5 1" radius="0.5" color="#7BC8A4" side="double" src="images.jpg"></a-cylinder>
        <a-cylinder position="-1 -1 -0.75" rotation="90 0 0" scale="1 0.5 1" radius="0.5" color="red" side="double"></a-cylinder>
        <a-cylinder position="1 -1 0.75" rotation="90 0 0" scale="1 0.5 1" radius="0.5" color="red" side="double"></a-cylinder>
        <a-cylinder position="1 -1 -0.75" rotation="90 0 0" scale="1 0.5 1" radius="0.5" color="red" side="double"></a-cylinder>
        <a-ring position="-1 -1 1.001" rotation="0 0 0" scale="0.45 0.45 0.45" side="double" src="tire.png"></a-ring>
        <a-ring position="-1 -1 -1.001" rotation="0 0 0" scale="0.45 0.45 0.45" color="green" side="double"></a-ring>
        <a-ring position="1 -1 1.001" rotation="0 0 0" scale="0.45 0.45 0.45" color="green" side="double"></a-ring>
        <a-ring position="1 -1 -1.001" rotation="0 0 0" scale="0.45 0.45 0.45" color="green" side="double"></a-ring>
      </a-box>
      <a-plane position="0 -0.5 -4" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
